gcp:
  project: ${GCP_PROJECT}
  location: us-central1
  bq_dataset: support_agent

llm:
  model: gemini-2.5-flash
  temperature: 0.1
  max_output_tokens: 1024
  # USD per 1M tokens. Check the Vertex AI pricing page when changing models;
  # cost tracking is only as good as these numbers.
  pricing:
    gemini-2.5-flash: {input: 0.30, output: 2.50}
    gemini-2.5-flash-lite: {input: 0.10, output: 0.40}
    gemini-2.5-pro: {input: 1.25, output: 10.00}

embeddings:
  enabled: true
  model: text-embedding-005

prompt:
  version: v3

retrieval:
  manuals_dir: data/manuals
  index_dir: artifacts/index
  top_k: 5
  rrf_k: 60
  # Below this BM25 score for the best chunk, we treat retrieval as "no evidence".
  min_bm25_score: 4.0

agent:
  max_steps: 6
  # Model-reported confidence below this hands off to a human.
  min_confidence: 0.6

devices:
  # "json" for local dev/tests, "bigquery" in production
  backend: json
  json_path: data/device_status.json
  bq_table: device_status

tracing:
  # "jsonl", "bigquery" or "none"
  sink: jsonl
  jsonl_path: artifacts/traces.jsonl
  bq_runs_table: agent_runs
  bq_spans_table: agent_spans

eval:
  questions: evals/questions.jsonl
  # CI fails below these. Agreed with the support team in the Q3 review.
  min_answer_accuracy: 0.85
  min_retrieval_hit_at_k: 0.90
  min_handoff_recall: 0.95
