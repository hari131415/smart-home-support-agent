[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.6.0"
description = "RAG support agent for smart home devices on Vertex AI Gemini, with tracing, guardrails and CI evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3,<2",
    "langchain-google-genai>=4.0",
    "google-cloud-bigquery>=3.17",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
support-agent = "support_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"support_agent.prompts" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
